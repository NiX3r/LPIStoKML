# Publishes web/ to GitHub Pages on every push to main (or by hand from the Actions tab).
# One-time setup: repo Settings → Pages → Source: "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - id: pages
        uses: actions/configure-pages@v6

      - name: Test
        run: node --test tests/

      - name: Prepare site
        env:
          BASE_URL: ${{ steps.pages.outputs.base_url }}  # e.g. https://nix3r.github.io/LPIStoKML or a custom domain
        run: |
          mkdir -p _site
          cp -r web/. _site/
          # Link previews (og:url, og:image) need absolute URLs.
          sed -i "s|https://nix3r.github.io/LPIStoKML/|${BASE_URL}/|g" _site/index.html _site/wiki.html
          grep -q "content=\"${BASE_URL}/og-image.png\"" _site/index.html
          touch _site/.nojekyll

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
